[package]
name = "sticky-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "sticky_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
